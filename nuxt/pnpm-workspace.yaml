allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  workerd: true
catalog:
  vite-plus: 1.7.0
overrides:
  # GHSA-p4f5-76q4-ffq7: every resolved `vite` package, including transitive peers
  # that the Vite+ core alias does not replace, must be the patched 8.3.8 release.
  vite: "8.3.8"
  # vite-plus 1.7.0 ships the same patched Vite as @voidzero-dev/vite-plus-core@8.3.8000.
  "vite-plus>vite": "npm:@voidzero-dev/vite-plus-core@8.3.8000"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
