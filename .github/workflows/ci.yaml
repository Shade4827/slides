name: Nuxt Lint

on:
  pull_request:
    paths:
      - "nuxt/**"
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nuxt

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: "pnpm"
          cache-dependency-path: ./nuxt/pnpm-lock.yaml

      - run: pnpm install
      - run: pnpm run lint