shamefullyHoist: true
autoInstallPeers: true
allowBuilds:
  esbuild: true
overrides:
  # GHSA-p4f5-76q4-ffq7: force every vite copy (including transitive) onto a patched release.
  vite: "8.3.8"
  # Replace vulnerable markdown-it 14.1.x. 15.x stays as resolved for packages that already depend on it.
  "markdown-it@<14.3.3": "14.3.3"
  "defu@<6.1.5": "6.1.7"
  "dompurify@<=3.4.16": "3.4.18"
  # Vite accepts esbuild ^0.27 or ^0.28. 0.28.1+ fixes GHSA-g7r4-m6w7-qqqr.
  "esbuild@<0.28.1": "0.28.2"
